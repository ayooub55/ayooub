<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 720 300" role="img" aria-label="Schéma de la liaison peptidique : deux acides aminés reliés par le groupe peptidique C alpha C O N H C alpha, disposé dans un plan, avec la flèche de résonance">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#152033"/></marker></defs>
  <rect x="150" y="138" width="350" height="124" rx="12" fill="#152033" opacity=".06"/>
  <text x="325" y="128" text-anchor="middle" font-size="12" fill="#152033" opacity=".75">plan du groupe peptidique (6 atomes)</text>
  <g stroke="#152033" stroke-width="2.1" fill="none" stroke-linecap="round">
    <line x1="140" y1="205" x2="160" y2="205"/>
    <line x1="190" y1="205" x2="255" y2="170"/>
    <line x1="285" y1="170" x2="350" y2="205"/>
    <line x1="380" y1="205" x2="445" y2="170"/>
    <line x1="475" y1="170" x2="492" y2="170"/>
    <line x1="266" y1="186" x2="264" y2="228"/>
    <line x1="276" y1="186" x2="278" y2="228"/>
    <line x1="372" y1="192" x2="386" y2="178"/>
    <line x1="175" y1="220" x2="175" y2="240"/>
    <line x1="460" y1="155" x2="460" y2="140"/>
  </g>
  <g stroke="#152033" stroke-width="2" fill="none">
    <circle cx="175" cy="205" r="15"/><circle cx="460" cy="170" r="15"/><circle cx="365" cy="205" r="15"/>
  </g>
  <g font-size="14.5" font-weight="700" fill="#152033" text-anchor="middle" dominant-baseline="middle">
    <text x="120" y="209">H₂N</text>
    <text x="175" y="206">Cα</text>
    <text x="270" y="172">C</text>
    <text x="365" y="206">N</text>
    <text x="460" y="171">Cα</text>
    <text x="396" y="174">H</text>
    <text x="271" y="244">O</text>
    <text x="516" y="174">COOH</text>
  </g>
  <g font-size="12" fill="#152033" opacity=".85" text-anchor="middle">
    <text x="175" y="256">R₁</text>
    <text x="460" y="132">R₂</text>
  </g>
  <path d="M283,196 Q320,214 348,199" stroke="#152033" stroke-width="1.7" fill="none" marker-end="url(#ar)"/>
  <text x="316" y="232" font-size="11" fill="#152033" opacity=".8" text-anchor="middle">résonance</text>
  <text x="600" y="212" font-size="11.5" fill="#152033" opacity=".8" text-anchor="middle">ω ≈ 180° (trans)</text>
</svg>